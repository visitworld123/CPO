# Model arguments
model_name_or_path: HuggingFaceH4/zephyr-7b-beta
torch_dtype: null
attn_implementation: null

# Data training arguments
dataset_mixer:
  HuggingFaceH4/ultrafeedback_binarized: 1.0
dataset_splits:
- train_prefs
- test_prefs
preprocessing_num_workers: 12

# DPOTrainer arguments
bf16: true
beta: 2.5
gamma: 0.05
tau: 2.0
easy_version: 'easy'
do_eval: true
eval_strategy: steps
eval_steps: 400
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: llama-3-SFT-8b-ecpo-full-beta-2.5_gamma-0.05-lr-6e-7-easy-version
learning_rate: 6.0e-7
log_level: info
logging_steps: 5
lr_scheduler_type: cosine
max_length: 2048
max_prompt_length: 1800
num_train_epochs: 1
optim: adamw_torch
output_dir: outputs/cpo
run_name: cpo-demo
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
push_to_hub: false
save_strategy: "steps"
save_steps: 1000000
save_total_limit: 1
seed: 0
warmup_ratio: 0.1
report_to: []
